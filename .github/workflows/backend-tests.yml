name: Backend offline tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements-auth.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements-auth.txt'
      - '.github/workflows/backend-tests.yml'
concurrency:
  group: pegas-backend-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PEGASVPN_DEPLOYMENT: tests
      PEGASVPN_TEST_DATA_DIR: /tmp/pegasvpn-offline-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare isolated offline data
        run: mkdir -p "$PEGASVPN_TEST_DATA_DIR"
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-auth.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Run isolated SQLite tests
        run: python -m unittest discover -s tests -v
